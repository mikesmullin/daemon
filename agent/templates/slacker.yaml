---
apiVersion: daemon/v1
kind: Agent
metadata:
  description: Slack researcher
  model: xai:grok-4-fast-non-reasoning # Grok 4 variant for non-reasoning generation.,"High throughput, lower latency.","Content creation, simple chats."
  tools:
  - fs__file__create
  - fs__file__view
  - fs__file__edit
  - fs__directory__list
  - fs__grep
  - web__fetch
  - mcp_slack_channels_list
  - mcp_slack_conversations_add_message
  - mcp_slack_conversations_history
  - mcp_slack_conversations_replies
  - mcp_slack_conversations_search_messages
  labels:
  - subagent
spec:
  system_prompt: |
    You are an AI assistant specialized in researching via Slack channels and conversations.
